<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratório NR-17</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: barra superior fixa; trilha de 5 estações; cada ensaio = abas Aprender/Praticar/Avaliação, palco do instrumento à direita e roteiro à esquerda */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --surface-2:#E2E7E3; --line:#C6CFCA;
  --ink:#15232A; --ink-2:#4B5B61; --ink-3:#6F7E83;
  --accent:#0E6670; --accent-ink:#FFFFFF; --accent-soft:#D3E7E7;
  --ac:#245E8C; --ac-soft:#DCE7F1;   /* acústica */
  --lu:#8A6A0E; --lu-soft:#F2E8C9;   /* iluminação */
  --te:#A1452D; --te-soft:#F3DED7;   /* térmico */
  --gr:#5A4E8C; --gr-soft:#E4E0F1;   /* integração */
  --ok:#24734A; --ok-soft:#D7ECDF; --bad:#B0281C; --bad-soft:#F6DAD6; --warn:#A35F00; --warn-soft:#F7E6CC;
  --lcd:#C3CDB0; --lcd-ink:#1C2618; --lcd-dim:#9DA88C;
  --dec-body:#1D2940; --dec-face:#C3312C; --ldr-body:#2E3236; --cal-body:#E9ECEF; --thar-body:#F1C232;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-lcd:"Share Tech Mono","IBM Plex Mono",ui-monospace,monospace;
  --scale:1;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1618; --surface:#162125; --surface-2:#1E2B30; --line:#2D3D43;
  --ink:#E3ECE9; --ink-2:#A3B4B3; --ink-3:#7F9092;
  --accent:#4FB3BA; --accent-ink:#0B1214; --accent-soft:#173A3D;
  --ac:#7FB2DC; --ac-soft:#1A2E3E; --lu:#D9B44A; --lu-soft:#3A3116; --te:#E08A70; --te-soft:#3D241D; --gr:#A99BE0; --gr-soft:#2A2640;
  --ok:#5CC48A; --ok-soft:#173527; --bad:#F07A6C; --bad-soft:#3E1D19; --warn:#E9A44A; --warn-soft:#3B2A12;
  --lcd:#A9B596; --lcd-ink:#141C11; --lcd-dim:#8A967A;
  --dec-body:#25324C; --ldr-body:#3A3F44; --cal-body:#C9CED3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1618; --surface:#162125; --surface-2:#1E2B30; --line:#2D3D43;
  --ink:#E3ECE9; --ink-2:#A3B4B3; --ink-3:#7F9092;
  --accent:#4FB3BA; --accent-ink:#0B1214; --accent-soft:#173A3D;
  --ac:#7FB2DC; --ac-soft:#1A2E3E; --lu:#D9B44A; --lu-soft:#3A3116; --te:#E08A70; --te-soft:#3D241D; --gr:#A99BE0; --gr-soft:#2A2640;
  --ok:#5CC48A; --ok-soft:#173527; --bad:#F07A6C; --bad-soft:#3E1D19; --warn:#E9A44A; --warn-soft:#3B2A12;
  --lcd:#A9B596; --lcd-ink:#141C11; --lcd-dim:#8A967A;
  --dec-body:#25324C; --ldr-body:#3A3F44; --cal-body:#C9CED3;
  color-scheme:dark}

*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.topbar-in{max-width:1240px;margin:0 auto;padding:.55rem 16px;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.6rem;cursor:pointer;background:none;border:0;padding:0;color:inherit;text-align:left}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.brand span{font-size:.82rem;opacity:.75}
.crumbs{font-size:.85rem;opacity:.85;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:.35rem;align-items:center}
.tbtn{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:4px;padding:.2rem .55rem;cursor:pointer;font-size:.85rem;font-family:var(--f-mono)}
.tbtn:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:1.5rem 4rem}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:2rem;align-items:start;padding-block:1rem 2rem;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.hero h1{font-size:clamp(2rem,4.2vw,3.2rem);font-weight:700;margin-top:.4rem;letter-spacing:-.01em}
.hero p.lead{font-size:1.12rem;color:var(--ink-2);margin-top:.9rem;max-width:60ch}
.idbox{margin-top:1.2rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.field label{font-size:.78rem;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

.map{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.map h2{font-size:1rem;font-weight:600;letter-spacing:.02em}
.map ol{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.5rem}
.map li{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:.6rem;font-size:.92rem;align-items:baseline}
.map li .it{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-3)}
.map li .to{display:block;font-size:.82rem;color:var(--ink-2)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:.1rem .45rem;border-radius:3px;font-weight:600;white-space:nowrap}
.c-ac{background:var(--ac-soft);color:var(--ac)} .c-lu{background:var(--lu-soft);color:var(--lu)} .c-te{background:var(--te-soft);color:var(--te)} .c-gr{background:var(--gr-soft);color:var(--gr)}

.trail-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.trail-h h2{font-size:1.5rem}
.trail{list-style:none;padding:0;margin:1rem 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.8rem;counter-reset:st}
.station{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.55rem;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s;min-width:0}
.station:hover{transform:translateY(-2px);border-color:var(--ink-3)}
.station .n{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1;color:var(--ink-3)}
.station h3{font-size:1.12rem;font-weight:600}
.station p{font-size:.88rem;color:var(--ink-2)}
.station .refs{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);margin-top:auto}
.station .st{display:flex;gap:.35rem;flex-wrap:wrap}
.trail::before{content:"";grid-column:1/-1;display:none}
.pill{font-family:var(--f-mono);font-size:.7rem;padding:.12rem .45rem;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.note{font-size:.88rem;color:var(--ink-2);margin-top:1.4rem;max-width:80ch}

/* página de ensaio */
.ens-head{display:flex;justify-content:space-between;gap:1.5rem;align-items:end;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.ens-head h1{font-size:clamp(1.6rem,3.2vw,2.4rem);font-weight:700;margin-top:.35rem}
.ens-head .refs{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3);margin-top:.35rem}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.tab{background:none;border:0;padding:.55rem 1rem;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.98rem;color:var(--ink-2);border-right:1px solid var(--line)}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab small{font-family:var(--f-mono);font-weight:400;font-size:.68rem;margin-left:.3rem;opacity:.75}

/* aprender */
.learn{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:2rem;margin-top:1.5rem;align-items:start}
.prose{max-width:72ch}
.prose h2{font-size:1.35rem;margin:1.8rem 0 .5rem}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:1.08rem;margin:1.2rem 0 .3rem}
.prose p{margin:.55rem 0}
.prose ul,.prose ol{margin:.5rem 0;padding-left:1.25rem}
.prose li{margin:.25rem 0}
.quote{border-left:3px solid var(--ink-3);padding:.35rem 0 .35rem .9rem;margin:.8rem 0;color:var(--ink-2);font-size:.96rem}
.quote cite{display:block;font-style:normal;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);margin-top:.2rem}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;margin:1rem 0}
.callout b.k{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:.2rem}
.formula{font-family:var(--f-mono);background:var(--surface-2);border-radius:4px;padding:.6rem .8rem;overflow-x:auto;font-size:.88rem;white-space:pre;margin:.6rem 0}
.tbl-wrap{overflow-x:auto;margin:.7rem 0}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.4rem .55rem;text-align:left;vertical-align:top}
table.t th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}
table.t tr.hl td{background:var(--accent-soft)}
.side{position:sticky;top:4.5rem;display:grid;gap:.8rem}
.side .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.9rem}
.side h4{font-size:.95rem;margin-bottom:.4rem}
.side ul{margin:0;padding-left:1.1rem;font-size:.88rem;color:var(--ink-2)}

/* praticar */
.lab{display:grid;grid-template-columns:270px minmax(0,1fr);gap:1.4rem;margin-top:1.4rem;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;position:sticky;top:4.5rem}
.steps li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.5rem;padding:.5rem .55rem;border-radius:5px;font-size:.92rem;align-items:start;color:var(--ink-3)}
.steps li .b{width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;background:var(--surface)}
.steps li.cur{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.steps li.cur .b{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.steps li.done{color:var(--ink-2)}
.steps li.done .b{border-color:var(--ok);background:var(--ok);color:#fff}
.steps li.err .b{border-color:var(--bad);background:var(--bad);color:#fff}
.stage{min-width:0;display:grid;gap:1rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;min-width:0}
.panel h2{font-size:1.3rem}
.panel h3{font-size:1.05rem}
.panel .sub{color:var(--ink-2);margin-top:.35rem;max-width:75ch}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.btn{background:var(--surface);border:1px solid var(--ink-3);border-radius:4px;padding:.5rem .9rem;cursor:pointer;font-weight:600;font-size:.95rem}
.btn:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline;padding-inline:.3rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fb{border-radius:5px;padding:.7rem .9rem;font-size:.95rem;display:grid;gap:.25rem}
.fb b{font-family:var(--f-display);font-size:1rem}
.fb.ok{background:var(--ok-soft);color:var(--ink)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink)} .fb.bad b{color:var(--bad)}
.fb.warn{background:var(--warn-soft);color:var(--ink)} .fb.warn b{color:var(--warn)}
.fb.info{background:var(--accent-soft);color:var(--ink)} .fb.info b{color:var(--accent)}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;width:7.5rem;font-family:var(--f-mono)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;font-size:.9rem}
.kv dt{color:var(--ink-3);font-family:var(--f-mono);font-size:.78rem;padding-top:.1rem}
.kv dd{margin:0}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:.9rem 1rem;font-size:.86rem;position:relative;box-shadow:0 1px 0 var(--line)}
.doc .dh{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px dashed var(--line);padding-bottom:.35rem;margin-bottom:.5rem}
.doc h4{font-size:.98rem;margin-bottom:.4rem}
.q{display:grid;gap:.6rem}
.q .opts{display:grid;gap:.4rem}
.opt{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:.6rem .8rem;cursor:pointer;font-size:.95rem}
.opt:hover{border-color:var(--ink-3)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.muted{color:var(--ink-3)}
.small{font-size:.85rem}
hr.s{border:0;border-top:1px solid var(--line);margin:.4rem 0}

/* instrumentos */
.bench{display:flex;gap:1.4rem;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:1rem;background:repeating-linear-gradient(90deg,var(--surface-2) 0 1px,transparent 1px 24px),repeating-linear-gradient(0deg,var(--surface-2) 0 1px,transparent 1px 24px),var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dec{width:220px;background:var(--dec-body);border-radius:34px 34px 46px 46px;padding:14px 14px 18px;color:#fff;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.dec .mic{width:34px;height:80px;margin:-6px auto 6px;background:linear-gradient(90deg,#9aa3ad,#e3e7ea,#8d959e);border-radius:6px 6px 3px 3px;position:relative}
.dec .mic::before{content:"";position:absolute;left:50%;top:-40px;width:72px;height:72px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 35%,#3b3f44,#16181a);opacity:var(--wind,0)}
.dec .face{background:var(--dec-face);border-radius:18px 18px 28px 28px;padding:10px 12px 12px}
.dec .lbl{font-family:var(--f-mono);font-size:.62rem;text-align:center;opacity:.85;margin-bottom:6px}
.lcd{background:var(--lcd);color:var(--lcd-ink);font-family:var(--f-lcd);border-radius:4px;padding:6px 8px;height:150px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 2px 5px rgba(0,0,0,.25);overflow:hidden;font-size:.78rem;line-height:1.15}
.lcd .ttl{text-align:center;border-bottom:1px solid var(--lcd-ink);padding-bottom:2px;margin-bottom:2px}
.lcd .big{font-size:2.6rem;text-align:right;line-height:1;letter-spacing:-.02em}
.lcd .big small{font-size:.9rem}
.lcd .mi{padding:0 3px}
.lcd .mi.on{background:var(--lcd-ink);color:var(--lcd)}
.lcd .row2{display:flex;justify-content:space-between}
.lcd .bar{height:6px;border:1px solid var(--lcd-ink);position:relative;margin-top:auto}
.lcd .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--lcd-ink)}
.lcd .spec{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:auto}
.lcd .spec i{flex:1;background:var(--lcd-ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.key{background:#f4f4f2;color:#1d1d1d;border:0;border-radius:10px;padding:.42rem 0;font-size:.8rem;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.key:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.key.red{background:#e8e2e0;color:var(--dec-face)}
.key small{display:block;font-size:.55rem;font-weight:600;opacity:.7}
.cal{width:118px;background:var(--cal-body);color:#1d1d1d;border-radius:12px 12px 8px 8px;padding:10px;box-shadow:0 8px 18px rgba(0,0,0,.18);position:relative}
.cal .cav{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;background:radial-gradient(circle,#111 0 34%,#555 35% 44%,#bbb 45%);}
.cal .cav.on{box-shadow:0 0 0 4px var(--ok)}
.cal .disp{background:#1b2a1b;color:#9ef59e;font-family:var(--f-lcd);text-align:center;padding:4px;border-radius:3px;font-size:1.1rem;min-height:1.8rem}
.cal .disp.off{color:#2c3a2c}
.cal .cb{display:grid;gap:5px;margin-top:8px}
.cal .cb button{border:0;border-radius:5px;padding:.3rem;font-weight:700;font-size:.75rem;cursor:pointer;background:#2c3440;color:#fff}
.cal .cb button.on{background:var(--ok)}
.cal .nm{font-family:var(--f-mono);font-size:.62rem;text-align:center;margin-top:6px;color:#333}
.ldr{width:200px;background:var(--ldr-body);border-radius:14px;padding:12px;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.ldr .lcd{height:118px}
.ldr .keys .key{border-radius:6px;font-size:.72rem}
.cell{width:96px;height:66px;background:#f1f1f1;border-radius:10px;display:grid;place-items:center;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.cell i{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ddd 60%,#bbb)}
.cell .cap{position:absolute;inset:6px;border-radius:8px;background:#222;display:grid;place-items:center;color:#aaa;font-family:var(--f-mono);font-size:.6rem}
.thar{width:150px;background:var(--thar-body);border-radius:16px 16px 22px 22px;padding:10px;color:#1d1d1d;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.thar .vane{width:70px;height:70px;border-radius:50%;margin:0 auto 8px;background:repeating-conic-gradient(#333 0 12deg,#999 12deg 30deg);border:5px solid #222}
.thar .lcd{height:84px}

/* planta */
.plan-wrap{overflow-x:auto}
svg.plan{width:100%;height:auto;display:block;touch-action:manipulation;font-family:var(--f-mono)}
svg.plan .wall{fill:none;stroke:var(--ink);stroke-width:8}

</head><body>

<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="goHome" type="button"><b>Laboratório NR-17</b><span>Condições ambientais de trabalho</span></button>
    <div class="crumbs" id="crumbs"></div>
    <div class="tools">
      <button class="tbtn" id="fMinus" type="button" title="Diminuir texto">A−</button>
      <button class="tbtn" id="fPlus" type="button" title="Aumentar texto (projeção)">A+</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<script>
/* ============ utilidades ============ */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const f=(x,d=1)=>(x==null||!isFinite(x))?'—':Number(x).toFixed(d).replace('.',',');
const pn=s=>{if(s==null)return null;const v=parseFloat(String(s).trim().replace(/\s/g,'').replace(',','.'));return isNaN(v)?null:v};
const logavg=a=>10*Math.log10(a.reduce((s,v)=>s+Math.pow(10,v/10),0)/a.length);
const logsum=a=>10*Math.log10(a.reduce((s,v)=>s+Math.pow(10,v/10),0));
const rnd=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1))};
const r1=x=>Math.round(x*10)/10;
const fb=(cls,t,body)=>`<div class="fb ${cls}"><b>${t}</b>${body?`<div>${body}</div>`:''}</div>`;
const timers=new Set();
function every(ms,fn){const id=setInterval(fn,ms);timers.add(id);return id}
function later(ms,fn){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id}
function clearTimers(){timers.forEach(id=>{clearInterval(id);clearTimeout(id)});timers.clear()}

/* ============ estado do aluno (conveniência local) ============ */
const KEY='labNR17.v1';
const S={aluno:'',turma:'',res:{}};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&typeof o==='object'){S.aluno=o.aluno||'';S.turma=o.turma||'';S.res=o.res||{}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setRes(id,kind,val){S.res[id]=S.res[id]||{};S.res[id][kind]=val;save()}
function getRes(id,kind){return (S.res[id]||{})[kind]}

/* ============ acústica: tabelas da NBR 10152 ============ */
const OCT=[63,125,250,500,1000,2000,4000,8000];
const OCTL=['63','125','250','500','1k','2k','4k','8k'];
const AW=[-26.2,-16.1,-8.6,-3.2,0,1.2,1.0,-1.1];
// Tabela 2 (63 Hz a 8 kHz) — NC 15 a 70
const NC_T={15:[47,36,28,22,18,14,12,11],20:[50,40,33,26,22,20,17,16],25:[54,44,37,31,27,24,22,22],30:[57,48,41,35,32,29,28,27],35:[60,52,45,40,36,34,33,32],40:[64,56,50,44,41,39,38,37],45:[67,60,54,49,46,44,43,42],50:[71,64,58,54,51,49,48,47],55:[74,67,62,58,56,54,53,52],60:[77,71,66,63,60,59,58,57],65:[80,75,71,68,65,64,63,62],70:[84,79,75,72,71,70,68,68]};
// curva NC interpolada de 1 em 1 dB (Anexo D: interpolação arredondada ao inteiro)
function ncCurve(nc){
  if(NC_T[nc])return NC_T[nc];
  const lo=Math.floor(nc/5)*5, hi=lo+5, t=(nc-lo)/5;
  return NC_T[lo].map((v,i)=>Math.round(v+(NC_T[hi][i]-v)*t));
}
function ncOf(spec){ // menor curva NC não ultrapassada em nenhuma banda
  for(let nc=15;nc<=70;nc++){const c=ncCurve(nc);if(spec.every((v,i)=>v<=c[i]+1e-9))return nc}
  return 71;
}
function laeqFromOct(spec){return logsum(spec.map((v,i)=>v+AW[i]))}

/* ============ conforto térmico: Anexo C da NBR 16401-2 ============ */
function pmvCalc(ta,tr,vel,rh,met,clo,wme){wme=wme||0;
 var pa=rh*10*Math.exp(16.6536-4030.183/(ta+235)),icl=0.155*clo,m=met*58.15,w=wme*58.15,mw=m-w,fcl=icl<=0.078?1+1.29*icl:1.05+0.645*icl,
 hcf=12.1*Math.sqrt(vel),taa=ta+273,tra=tr+273,tcla=taa+(35.5-ta)/(3.5*icl+0.1),p1=icl*fcl,p2=p1*3.96,p3=p1*100,p4=p1*taa,
 p5=308.7-0.028*mw+p2*Math.pow(tra/100,4),xn=tcla/100,xf=tcla/50,eps=0.00015,n=0,hcn,hc;
 while(Math.abs(xn-xf)>eps){xf=(xf+xn)/2;hcn=2.38*Math.pow(Math.abs(100*xf-taa),0.25);hc=hcf>hcn?hcf:hcn;xn=(p5+p4*hc-p2*Math.pow(xf,4))/(100+p3*hc);if(++n>150)return null}
 var tcl=100*xn-273,hl1=3.05e-3*(5733-6.99*mw-pa),hl2=mw>58.15?0.42*(mw-58.15):0,hl3=1.7e-5*m*(5867-pa),hl4=0.0014*m*(34-ta),
 hl5=3.96*fcl*(Math.pow(xn,4)-Math.pow(tra/100,4)),hl6=fcl*hc*(tcl-ta),ts=0.303*Math.exp(-0.036*m)+0.028,p=ts*(mw-hl1-hl2-hl3-hl4-hl5-hl6);
 return {pmv:p,ppd:100-95*Math.exp(-0.03353*Math.pow(p,4)-0.2179*p*p)}}
function trGlobo(tg,ta,va){ // NBR 16401-2, 7.2.2.1, globo D = 0,15 m
  const D=0.15,hn=1.4*Math.pow(Math.abs(tg-ta)/D,0.25),hf=6.3*Math.pow(va,0.6)/Math.pow(D,0.4);
  const forc=hf>hn;
  const tr=forc?Math.pow(Math.pow(tg+273,4)+2.5e8*Math.pow(va,0.6)*(tg-ta),0.25)-273
               :Math.pow(Math.pow(tg+273,4)+0.4e8*Math.pow(Math.abs(tg-ta),0.25)*(tg-ta),0.25)-273;
  return {tr,forc,hn,hf};
}
function coefA(va){return va<0.2?0.5:(va<0.6?0.6:0.7)}

/* ============ quiz (Avaliação) ============ */
/* q: {tipo:'mc', q, opts:[...], ok:idx, exp} | {tipo:'num', q, ans, tol, un, exp} */
function runQuiz(el,id,gen,intro){
  let Q=gen(), i=0, pts=0, answered=false, log=[];
  function draw(){
    clearTimers();
    if(i>=Q.length){
      const pct=Math.round(100*pts/Q.length);
      setRes(id,'aval',{nota:pts,total:Q.length,pct,quando:new Date().toLocaleString('pt-BR')});
      el.innerHTML=`<div class="panel"><div class="eyebrow">Avaliação concluída</div>
        <div class="row" style="margin-top:.6rem;gap:1.2rem"><div class="score num">${pts}/${Q.length}</div>
        <div><b>${pct}% de acertos</b><p class="muted small">Resultado registrado no relatório final da trilha.</p></div></div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th>Questão</th><th>Resultado</th></tr></thead><tbody>
        ${log.map((l,k)=>`<tr><td>${k+1}</td><td>${l.q}</td><td>${l.ok?'<span class="pill ok">acerto</span>':'<span class="pill bad">erro</span>'}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="row"><button class="btn pri" id="qAgain" type="button">Nova avaliação (questões e números sorteados de novo)</button></div></div>`;
      $('#qAgain',el).onclick=()=>{Q=gen();i=0;pts=0;log=[];draw()};
      return;
    }
    const q=Q[i]; answered=false;
    let body='';
    if(q.tipo==='mc'){
      q._ord=q._ord||shuffle(q.opts.map((_,k)=>k));
      body=`<div class="opts">${q._ord.map(k=>`<button class="opt" type="button" data-k="${k}">${q.opts[k]}</button>`).join('')}</div>`;
    } else {
      body=`<div class="row"><input class="inp" id="qNum" inputmode="decimal" autocomplete="off" aria-label="Resposta"> <span class="muted">${q.un||''}</span></div>`;
    }
    el.innerHTML=`<div class="panel q">
      ${i===0&&intro?`<p class="muted small">${intro}</p>`:''}
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Questão ${i+1} de ${Q.length}</span><span class="pill">${pts} acerto(s)</span></div>
      <div style="font-size:1.05rem">${q.q}</div>${body}
      <div id="qFb"></div>
      <div class="row"><button class="btn pri" id="qGo" type="button">Confirmar resposta</button></div></div>`;
    let sel=null;
    $$('.opt',el).forEach(b=>b.onclick=()=>{if(answered)return;$$('.opt',el).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.k});
    $('#qGo',el).onclick=()=>{
      if(answered){i++;draw();return}
      let ok;
      if(q.tipo==='mc'){ if(sel==null){$('#qFb',el).innerHTML=fb('warn','Escolha uma alternativa.');return}
        ok=sel===q.ok;
        $$('.opt',el).forEach(b=>{const k=+b.dataset.k;if(k===q.ok)b.classList.add('right');else if(k===sel)b.classList.add('wrong')});
      } else { const v=pn($('#qNum',el).value); if(v==null){$('#qFb',el).innerHTML=fb('warn','Digite um número (use vírgula ou ponto).');return}
        ok=Math.abs(v-q.ans)<=q.tol+1e-9; }
      answered=true; if(ok)pts++; log.push({q:q.titulo||('Questão '+(i+1)),ok});
      $('#qFb',el).innerHTML=fb(ok?'ok':'bad',ok?'Correto.':(q.tipo==='num'?`Não confere. Resposta esperada: ${f(q.ans,q.dec??1)} ${q.un||''}`:'Não é essa.'),q.exp);
      $('#qGo',el).textContent=i<Q.length-1?'Próxima questão':'Ver resultado';
    };
  }
  draw();
}

/* ============ motor de etapas (Praticar) ============ */
function makeLab(el,steps,st,onAll){
  st.cur=st.cur||0; st.done=st.done||{}; st.err=st.err||{}; st.max=st.max||0;
  function draw(){
    clearTimers();
    el.innerHTML=`<div class="lab"><ol class="steps" aria-label="Etapas">${steps.map((s,i)=>`<li data-i="${i}" class="${i===st.cur?'cur':''} ${st.done[i]?'done':''} ${st.err[i]&&!st.done[i]?'err':''}"><span class="b">${st.done[i]?'✓':i+1}</span><span>${s.t}</span></li>`).join('')}</ol><div class="stage" id="stage"></div></div>`;
    $$('.steps li',el).forEach(li=>{const i=+li.dataset.i;if(i<=st.max){li.style.cursor='pointer';li.onclick=()=>{st.cur=i;draw()}}});
    steps[st.cur].render($('#stage',el),st,next,draw);
  }
  function next(){
    st.done[st.cur]=true; st.max=Math.max(st.max,st.cur+1);
    if(st.cur<steps.length-1)st.cur++;
    if(Object.keys(st.done).length>=steps.length&&onAll)onAll();
    draw(); const top=el.getBoundingClientRect().top+window.scrollY-70; if(window.scrollY>top)window.scrollTo({top,behavior:'smooth'});
  }
  draw(); return {draw,next};
}
/* botão de avançar padrão */
const nextBtn=(lbl,dis)=>`<div class="row"><button class="btn pri" type="button" data-next ${dis?'disabled':''}>${lbl||'Avançar para a próxima etapa'}</button></div>`;
function bindNext(box,next){const b=$('[data-next]',box);if(b)b.onclick=next}
/* questão de múltipla escolha embutida na prática */
function inlineMC(box,sel,q,onAns){
  const el=$(sel,box); const ord=shuffle(q.opts.map((_,k)=>k)); let done=false;
  el.innerHTML=`<div class="q"><div>${q.q}</div><div class="opts">${ord.map(k=>`<button class="opt" type="button" data-k="${k}">${q.opts[k]}</button>`).join('')}</div><div class="qf"></div></div>`;
  $$('.opt',el).forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k; const ok=k===q.ok;
    if(done&&ok)return;
    $$('.opt',el).forEach(x=>x.classList.remove('wrong'));
    b.classList.add(ok?'right':'wrong');
    $('.qf',el).innerHTML=fb(ok?'ok':'bad',ok?'Correto.':'Reveja: tente outra alternativa.',ok?q.exp:(q.hint||''));
    if(!done){done=true;onAns&&onAns(ok,true)} else if(ok){onAns&&onAns(ok,false)}
    if(ok)done=true;
  });
}

/* ============ blocos autoinstrucionais ============ */
let cadN=0;
const concept=(t,html)=>`<div class="concept"><div class="ct">Conceito</div><h3>${t}</h3>${html}</div>`;
function caderno(html,id){
  const k=id||('cad'+(++cadN)); const marked=!!(S.res._cad||{})[k];
  return `<div class="caderno"><div class="ic">ANOTE</div><div><div class="ct">No seu caderno</div>${html}
  <label><input type="checkbox" data-cad="${k}" ${marked?'checked':''}> Anotei</label></div></div>`;
}
function bindCaderno(root){$$('[data-cad]',root).forEach(c=>c.onchange=()=>{S.res._cad=S.res._cad||{};S.res._cad[c.dataset.cad]=c.checked;save()})}
const trecho=(t,src,html)=>`<details class="trecho"><summary>${t}<span class="src">${src}</span></summary><div class="tx">${html}</div></details>`;
/* ============ DEC-7000 virtual ============ */
class Dec7000{
  constructor(o){
    o=o||{};
    this.input=o.input||(()=>45);         // nível acústico real no microfone (dB)
    this.offset=o.offset??0.6;            // erro de sensibilidade antes do ajuste (dB)
    this.state='main'; this.cur=0; this.calLevel=94.0; this.calHist=[];
    this.onEvent=o.onEvent||(()=>{});
    this.meas=null; // {t, T, vals, max, label}
    this.screen='nivel';
  }
  read(){return this.input()+this.offset}
  calFactor(){return (-6.10+ (0.6-this.offset)).toFixed(2)}
  html(){return `<div class="dec" aria-label="Sonômetro DEC-7000 virtual"><div class="mic"></div><div class="face">
    <div class="lbl">Sonômetro Digital · Mod. DEC-7000 · Classe 1</div>
    <div class="lcd" data-dec-lcd></div>
    <div class="keys">
      <button class="key" type="button" data-k="esc">ESC<small>voltar</small></button>
      <button class="key" type="button" data-k="up" aria-label="Seta para cima">▲</button>
      <button class="key red" type="button" data-k="menu">MENU<small>pausa</small></button>
      <button class="key" type="button" data-k="left" aria-label="Seta para a esquerda">◄</button>
      <button class="key" type="button" data-k="enter">ENTER<small>✓</small></button>
      <button class="key" type="button" data-k="right" aria-label="Seta para a direita">►</button>
      <button class="key" type="button" data-k="light" aria-label="Luz de fundo">☼</button>
      <button class="key" type="button" data-k="down" aria-label="Seta para baixo">▼</button>
      <button class="key red" type="button" data-k="start">START<small>stop</small></button>
    </div></div></div>`}
  mount(root){this.root=root;$$('[data-k]',root).forEach(b=>b.onclick=()=>this.key(b.dataset.k));this.paint()}
  menuItems(){return {menu:['Function','Calibration','Measurement','Setup','Language','Output','Factory Settings'],cal:['By Measurement','By Cal.Factor']}[this.state]}
  key(k){
    const s=this.state;
    if(s==='main'){
      if(k==='menu'&&!this.meas){this.state='menu';this.cur=0}
      else if(k==='start'){this.onEvent('start')}
      else if(k==='left'||k==='right'){this.screen=this.screen==='nivel'?'oitava':'nivel'}
    } else if(s==='menu'||s==='cal'){
      const it=this.menuItems();
      if(k==='up')this.cur=(this.cur+it.length-1)%it.length;
      if(k==='down')this.cur=(this.cur+1)%it.length;
      if(k==='esc'){this.state=s==='cal'?'menu':'main';this.cur=s==='cal'?1:0}
      if(k==='menu')this.state='main';
      if(k==='enter'){
        if(s==='menu'){ if(it[this.cur]==='Calibration'){this.state='cal';this.cur=0} else this.onEvent('menu-other',it[this.cur]) }
        else { if(this.cur===0){this.state='calLvl'} else {this.state='calFac';this.onEvent('calfac')} }
      }
    } else if(s==='calLvl'){
      if(k==='up')this.calLevel=r1(this.calLevel+0.1);
      if(k==='down')this.calLevel=r1(this.calLevel-0.1);
      if(k==='right')this.calLevel=r1(this.calLevel+1);
      if(k==='left')this.calLevel=r1(this.calLevel-1);
      this.calLevel=Math.max(0,Math.min(199.9,this.calLevel));
      if(k==='esc'){this.state='cal';this.cur=0}
      if(k==='start'){this.state='calRun';this.delay=5;this.prog=0;
        const tick=()=>{ if(this.state!=='calRun')return; if(this.delay>0){this.delay--;} else {this.prog+=34;}
          if(this.prog>=100){ const lin=this.input(); this.pending={newOffset:this.calLevel-lin, lin, at:Date.now()}; this.state='calDone'; this.onEvent('caldone',this.pending)}
          this.paint(); if(this.state==='calRun')later(700,tick) };
        later(700,tick); this.onEvent('calstart',{level:this.calLevel});
      }
    } else if(s==='calRun'){
      if(k==='esc'){this.state='calLvl'}
    } else if(s==='calDone'){
      if(k==='enter'){this.offset=this.pending.newOffset;this.calHist.push({lvl:this.calLevel,fac:this.calFactor()});this.state='main';this.onEvent('calapplied',{level:this.calLevel,lin:this.pending.lin})}
      if(k==='esc'){this.state='calLvl';this.onEvent('calcancel')}
    } else if(s==='calFac'){

  }

    if(!this.root)return; const L=$('[data-dec-lcd]',this.root); if(!L)return;

        ${s==='calRun'?(this.delay>0?`<div style="margin-top:8px;text-align:center">DELAY:${this.delay} S</div>`:`<div class="bar" style="margin-top:12px"><i style="width:${this.prog}%"></i></div>`):''}
        ${s==='calDone'?`<div style="text-align:center;margin-top:6px">Done</div><div class="row2" style="margin-top:auto"><span class="mi on">Cancel ESC</span><span class="mi on">OK ENTER</span></div>`:''}`;
    } else if(s==='calFac'){

    }
  }

/* ============ CAL-5000 virtual ============ */
class Cal5000{
  constructor(o){o=o||{};this.true94=o.true94??94.0;this.true114=o.true114??114.0;this.on=false;this.level=null;this.coupled=false;this.t0=null;this.onChange=o.onChange||(()=>{})}
  stable(){return this.on&&this.level&&this.t0&&(Date.now()-this.t0)>=10000}
  secs(){return this.t0?Math.floor((Date.now()-this.t0)/1000):0}
  output(){ // nível real gerado na cavidade
    if(!this.on||!this.level||!this.coupled)return null;
    const tgt=this.level===94?this.true94:this.true114; const s=(Date.now()-this.t0)/1000;
    return s>=10?tgt:tgt-1.6*Math.exp(-s/2.6); // subida até estabilizar
  }
  html(){return `<div class="cal" aria-label="Calibrador CAL-5000 virtual"><button class="cav" type="button" data-cal="cav" title="Encaixar/desencaixar o microfone" style="border:0;cursor:pointer;display:block"></button>
    <div class="disp" data-cal-disp></div>
    <div class="cb"><button type="button" data-cal="pw">LIGA / DESL.</button><button type="button" data-cal="94">94 dB</button><button type="button" data-cal="114">114 dB</button></div>
    <div class="nm">CAL-5000 · IEC 60942 cl. 1</div></div>`}
  mount(root){this.root=root;$$('[data-cal]',root).forEach(b=>b.onclick=()=>this.press(b.dataset.cal));this.paint()}
  press(k){
    if(k==='cav'){this.coupled=!this.coupled}
    if(k==='pw'){this.on=!this.on;this.level=null;this.t0=null}
    if((k==='94'||k==='114')&&this.on){this.level=+k;this.t0=Date.now()}
    this.paint();this.onChange(k);
  }
  paint(){if(!this.root)return;const d=$('[data-cal-disp]',this.root);d.className='disp'+(this.on?'':' off');d.textContent=this.on?(this.level?this.level:'---'):'88.8';
    $('[data-cal="cav"]',this.root).classList.toggle('on',this.coupled);
    $('[data-cal="94"]',this.root).classList.toggle('on',this.level===94);$('[data-cal="114"]',this.root).classList.toggle('on',this.level===114)}
}

  mount(root){this.root=root;$$('[data-l]',root).forEach(b=>{b.onclick=()=>this.press(b.dataset.l);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();this.press(b.dataset.l)}}});this.paint();every(250,()=>this.paint())}
  press(k){

    if(k==='pw'){this.on=!this.on;if(this.on){this.t0=Date.now();this.zeroOk=this.cap;this.setMode=null}else{this.t0=null}}

    else if(k==='set'){this.setMode=this.setMode?null:'set07';this.setCur=0}
    else if(this.setMode&&(k==='up'||k==='down')){this.setCur=(this.setCur+(k==='up'?SCFS.length-1:1))%SCFS.length}

    else if(k==='hold'){this.hold=!this.hold;this.holdV=this.value()}
    else if(k==='mem'){const v=this.value();if(v!=null){this.mem.push(v)}}

  }
  paint(){if(!this.root)return;const L=$('[data-ldr-lcd]',this.root);if(!L)return;

    const v=this.hold?this.holdV:this.value();

aprender(){return `
<h2>Por que um ensaio só para "ajustar" o sonômetro?</h2>
<p>Antes de medir qualquer ruído, o higienista precisa garantir que o sonômetro está indicando o valor correto. Um microfone sofre influência de temperatura, umidade e pressão do ar, e pequenos desvios se acumulam. A ABNT NBR 10152:2017 trata disso em três momentos diferentes, que costumam ser confundidos. Este ensaio prepara o instrumento que será usado no Ensaio 2.</p>

<p><b>Verificação</b> é a confirmação, ao final da série, de que o sonômetro continua indicando o valor ajustado (NBR 10152, 3.2).</p>`)}
${trecho('Termos e definições','NBR 10152:2017 · 3.1 e 3.2',`<p><b>3.1 ajuste</b> — conjunto de operações efetuadas no sistema de medição, de modo que ele forneça indicações prescritas correspondentes aos valores da grandeza a ser medida.</p><p><b>3.2 verificação</b> — confirmação de que as propriedades relativas ao desempenho ou aos requisitos legais são satisfeitas pelo sistema de medição.</p><p>NOTA 1 Convém não confundir a calibração com o ajuste de um sistema de medição nem com a verificação da calibração.</p>`)}
${caderno(`<ol><li>Com suas palavras, diferencie <b>calibração</b>, <b>ajuste</b> e <b>verificação</b>. Para cada um, diga <i>quem faz</i>, <i>onde</i> e <i>quando</i>.</li></ol>`,'e1a')}

<h2>Requisitos dos instrumentos</h2>
<p>A norma não aceita qualquer sonômetro. O conjunto <b>sonômetro + microfone + calibrador</b> precisa ter classe compatível e calibração válida.</p>
${trecho('Instrumentação','NBR 10152:2017 · 5.1, 5.2 e 5.3',`<p><b>5.1</b> O sonômetro deve atender aos critérios da IEC 61672 (todas as partes) para a classe 1 ou classe 2. [...] Para medição e caracterização de som tonal, o sonômetro deve possuir filtros de 1/3 de oitava.</p><p><b>5.2</b> O calibrador de nível sonoro deve atender à IEC 60942, para a classe 1. Quando o sonômetro utilizado for de classe 2, o calibrador de nível sonoro pode ser de classe 2.</p><p><b>5.3</b> O microfone de medição deve ser especificado para atender à IEC 61672-1 ou IEC 61094-4.</p>`)}
${trecho('Calibração em laboratório','NBR 10152:2017 · 6',`<p>O conjunto de instrumentos [...] deve ser calibrado por laboratório acreditado, membro da Rede Brasileira de Calibração – RBC, ou pelo Inmetro, ou por laboratório de calibração, em outros países, acreditado por organismos signatários de acordos oficiais de reconhecimento mútuo.</p><p>[...] O prazo entre duas calibrações consecutivas não pode ultrapassar a 24 meses.</p><p>Calibrações devem ser realizadas após qualquer evento que possa produzir dano aos instrumentos, sempre que o instrumento sofrer manutenção corretiva e sempre que a variação entre ajustes indicar instabilidade.</p><p>Quando o resultado de algum parâmetro, apresentado no certificado de calibração, não atender aos requisitos da respectiva norma IEC, o instrumento não pode ser utilizado.</p>`)}
<div class="tbl-wrap"><table class="t"><thead><tr><th>Instrumento</th><th>Classe</th><th>Norma de referência</th></tr></thead><tbody>

${concept('O que o certificado do calibrador precisa trazer (Anexo B.4)',`<p>Amplitude em dB (ref. 20 µPa), frequência em hertz e distorção harmônica. A norma observa que, na época da publicação, não havia acreditação para a distorção, e recomenda informá-la em documento à parte.</p>`)}

function e2Gen(sc,pts,eventIdx){

  const acP={x:sc.ac.x,y:sc.D-0.15,h:2.4};
  return pts.map((p,i)=>{
    const d=Math.hypot(p.x-acP.x,p.y-acP.y,p.h-acP.h), boost=3*Math.exp(-Math.max(0,d-1)/2.2)-1;
    const th=base.th.map((v,k)=>v+sh+(k<6?boost:boost*0.4)+0.6*gauss());
    let oct=base.oct.map((v,k)=>v+sh+(k===2?boost*0.4:0)+0.6*gauss());
    oct[0]=logsum(th.slice(0,3)); oct[1]=logsum(th.slice(3,6));
    const LA=laeqFromOct(oct);
    const ser=[]; for(let t=0;t<30;t++)ser.push(LA+0.8*gauss());

    if(i===eventIdx){const t0=Math.floor(rnd(9,21));ev={t0,txt:pick(['uma porta bateu no corredor','um aluno falou alto do lado de fora da sala','um celular tocou dentro da sala'])};ser[t0]+=21;ser[t0+1]+=13;ser[t0+2]+=5}

    const las=ser.map(v=>v+0.4*gauss()); const mx=Math.max(...las)+rnd(0.4,1.2);

}
function e2Rep(M){

  {t:'Medir 30 s por ponto',render(box,st,next){

          if(m.ev){$('#msg',box).innerHTML=fb('warn',`Medição de P${i+1} concluída: LAeq,30s = ${f(m.laeq,1)} dB, LASmax = ${f(m.max,1)} dB.`,`Durante a medição, ${m.ev.txt}. O que você faz com este resultado?`)+`<div class="row" style="margin-top:.5rem"><button class="btn" type="button" id="acc">Registrar o resultado</button><button class="btn" type="button" id="dsc">Descartar e medir de novo</button></div>`;
            $('#acc',box).onclick=()=>{st.err[2]=1;m.ok=true;$('#msg',box).innerHTML=fb('bad','Esse resultado não deveria ser registrado.','Item 7.4: "Devem ser descartados resultados de medição de nível sonoro afetados por sons intrusivos". Vale também para o LASmax (7.5.3). Clique em "Medir de novo" neste ponto.');show()};
            $('#dsc',box).onclick=()=>{const p=[st.pts[i]];st.M[i]=e2Gen(sc,p,-1)[0];$('#msg',box).innerHTML=fb('ok','Decisão correta.','Som intrusivo descartado (item 7.4). Pressione START para medir P'+(i+1)+' de novo.');show()};
          } else { m.ok=true; $('#msg',box).innerHTML=fb('ok',`P${i+1} registrado: LAeq,30s = ${f(m.laeq,1)} dB · LASmax = ${f(m.max,1)} dB.`,'Selecione o próximo ponto.'); const nx=st.M.findIndex(x=>x.ok!==true); if(nx>=0)st.sel=nx; }

    box.innerHTML=`<div class="panel"><div class="eyebrow">Etapa 3</div><h2>Meça cada ponto</h2><p class="sub">O DEC-7000 já está ajustado (Cal.Level 93,8 dB, Ensaio 1). Condição do ambiente: sala vazia, portas e janelas fechadas, ${SPEC[sc.var].fonte}. Para cada ponto: selecione-o na tabela e pressione <b>START</b> no sonômetro.</p></div>

  {t:'Calcular os descritores',render(box,st,next){

      ${M.map((m,i)=>`<tr><td>P${i+1}</td><td class="r">${f(m.laeq,1)}</td><td class="r">${f(m.max,1)}</td>${m.oct.map(v=>`<td class="r">${f(v,1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="small muted">Valores em dB. Bandas de oitava sem ponderação (Z), em Hz.</p></div>
      <div class="panel"><h3>1. LAeq e LASmax representativos</h3><p class="sub">Use a média logarítmica para o LAeq (7.5.2) e o maior valor para o LASmax (7.5.4). Faça a conta na calculadora e registre no caderno.</p>

      <div class="panel" id="p2" hidden><h3>2. Espectro representativo e nível NC</h3><p class="sub">O sonômetro calculou a média logarítmica de cada banda. Compare com as curvas NC (Tabela 2) e encontre a <b>menor curva que não é ultrapassada em nenhuma banda</b>.</p>

      <div class="panel" id="p3" hidden><h3>3. Existe som tonal? (Anexo A)</h3><p class="sub">Níveis representativos em bandas de 1/3 de oitava na região grave:</p>

        <div id="q3"></div></div>
      <div class="panel" id="p4" hidden><h3>4. Incerteza expandida (Anexo C)</h3>
        <div class="formula">a = 1 dB (classe 1)
s = ${f(rep.s,2)} dB (desvio-padrão dos ${rep.n} valores de LAeq,1s de todos os pontos)
b = s/√n = ${f(rep.s,2)}/√${rep.n} = ${f(rep.b,3)} dB
u = √(a² + b²) = ${f(rep.u,3)} dB
U = 2 × u = ${f(rep.U,1)} dB  (k = 2, ≈ 95 %)</div>
        ${caderno('Registre os resultados no formato do relatório: LAeq = ___ ± ___ dB; LASmax = ___ dB; LNC = ___; som tonal: ___.','e2p4')}${nextBtn('Ir para a avaliação do ambiente')}</div>`;
    $('#c1',box).onclick=()=>{const a=pn($('#la',box).value),b=pn($('#lm',box).value);const okA=a!=null&&Math.abs(a-rep.laeq)<=0.15, okB=b!=null&&Math.abs(b-rep.max)<=0.1;
      if(!(okA&&okB))st.err[3]=1;

  {t:'Avaliar o ambiente',render(box,st,next){

    inlineMC(box,'#v1',{q:'<b>Método simplificado (9.1).</b> Considerando LAeq e LASmax, o ambiente é:',opts:[simpOk?'Adequado.':'Inadequado.',simpOk?'Inadequado.':'Adequado.'],ok:0,exp:simpOk?`LAeq ${f(L,1)} ≤ ${R[1]+5} e LASmax ${f(Mx,1)} ≤ ${R[2]+5}.`:`LAeq ${f(L,1)} dB ${L>R[1]+5?'ultrapassa':'não ultrapassa'} ${R[1]+5} dB; LASmax ${f(Mx,1)} dB ${Mx>R[2]+5?'ultrapassa':'não ultrapassa'} ${R[2]+5} dB.`},(ok,first)=>{if(first&&!ok)st.err[4]=1;$('#v2',box).hidden=false});

    const others=['Sim, é obrigatório: há suspeita de som tonal ou predominância abaixo de 250 Hz (item 9).','Não há necessidade: o simplificado já considerou o ambiente inadequado (item 9).','Não é obrigatório, mas pode ser aplicado para completar a análise.'].filter(x=>x!==o2);

quiz(){
  const Rr=pick([TAB3[0],TAB3[5],TAB3[7],TAB3[3]]);
  const pts=[0,1,2,3].map(()=>r1(Rr[1]+rnd(-2,4)));
  const lav=logavg(pts);
  const A=pick([45,64,75,96]); const nmin=3+(A>30?Math.floor((A-30)/30):0);

function e3Lums(sc){const L=[];for(let j=0;j<sc.M;j++)for(let i=0;i<sc.N;i++){L.push({i,j,x:(i+0.5)*sc.W/sc.N,y:(j+0.5)*sc.D/sc.M,off:!!(sc.off||[]).find(o=>o[0]===i&&o[1]===j)})}return L}
function e3Model(sc){
  const L=e3Lums(sc), h=sc.H-0.75;
  const unit=(x,y,incl)=>L.reduce((s,l)=>s+((incl||!l.off)?h*h/Math.pow((x-l.x)**2+(y-l.y)**2+h*h,2):0),0);
  let acc=0,n=0; for(let x=0.125;x<sc.W;x+=0.25)for(let y=0.125;y<sc.D;y+=0.25){acc+=unit(x,y,true);n++}
  const I0=0.82*sc.alvo/(acc/n);
  const wall=(x,y)=>{const d=Math.min(x,sc.W-x,y,sc.D-y);return 0.85+0.15*Math.min(1,d/1.2)};
  return (x,y,daylight)=>{let e=I0*unit(x,y)+0.18*sc.alvo*wall(x,y);
    if(daylight){const w=sc.win; const d=w.wall==='E'?sc.W-x:w.wall==='W'?x:w.wall==='N'?sc.D-y:y; e+=1900*Math.exp(-d/1.1)}
    return e};
}
function e3Points(sc){
  const N=sc.N,M=sc.M,dx=sc.W/N,dy=sc.D/M,x0=dx/2,y0=dy/2, X=i=>x0+i*dx, Yc=j=>y0+j*dy;
  const ci=Math.floor((N-2)/2), cj=Math.floor((M-2)/2);
  const c2=N-1>=2?[ci+1,cj]:[ci,Math.min(cj+1,M-2)];
  const quad=(cx,cy)=>[[cx+dx/4,cy+dy/4],[cx+3*dx/4,cy+dy/4],[cx+3*dx/4,cy+3*dy/4],[cx+dx/4,cy+3*dy/4]];
  const P=[];
  quad(X(ci),Yc(cj)).forEach((p,k)=>P.push({id:'r'+(k+1),g:'R',x:p[0],y:p[1]}));
  quad(X(c2[0]),Yc(c2[1])).forEach((p,k)=>P.push({id:'r'+(k+5),g:'R',x:p[0],y:p[1]}));
  P.push({id:'q1',g:'Q',x:X(ci)+dx/4,y:y0/2},{id:'q2',g:'Q',x:X(ci)+3*dx/4,y:y0/2},{id:'q3',g:'Q',x:X(ci)+dx/4,y:sc.D-y0/2},{id:'q4',g:'Q',x:X(ci)+3*dx/4,y:sc.D-y0/2});
  P.push({id:'t1',g:'T',x:x0/2,y:Yc(cj)+dy/4},{id:'t2',g:'T',x:x0/2,y:Yc(cj)+3*dy/4},{id:'t3',g:'T',x:sc.W-x0/2,y:Yc(cj)+dy/4},{id:'t4',g:'T',x:sc.W-x0/2,y:Yc(cj)+3*dy/4});
  P.push({id:'p1',g:'P',x:x0/2,y:y0/2},{id:'p2',g:'P',x:sc.W-x0/2,y:sc.D-y0/2});
  return P;
}
function e3IM(vals,N,M){const g=k=>mean(vals.filter(v=>v.g===k).map(v=>v.v));const R=g('R'),Q=g('Q'),T=g('T'),P=g('P');
  return {R,Q,T,P,IM:(R*(N-1)*(M-1)+Q*(N-1)+T*(M-1)+P)/(N*M)}}

  {t:'Medir a iluminância média',render(box,st,next){

  {t:'Calcular a IM',render(box,st,next){
    const sc=E3SC[st.scId]; const vals=st.P.map(p=>({g:p.g,v:Math.round(st.vals[p.id])})); const r=st.im=e3IM(vals,sc.N,sc.M);
    box.innerHTML=`<div class="panel"><div class="eyebrow">Etapa 4</div><h2>Iluminância média do ambiente</h2>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>Grupo</th><th>Valores (lux)</th><th class="r">Média</th></tr></thead><tbody>${['R','Q','T','P'].map(g=>`<tr><td>${g}</td><td class="num">${vals.filter(v=>v.g===g).map(v=>v.v).join(' · ')}</td><td class="r num">${f(r[g],2)}</td></tr>`).join('')}</tbody></table></div>
      <div class="formula">IM = [ R·(N−1)·(M−1) + Q·(N−1) + T·(M−1) + P ] / (N·M)      N = ${sc.N}   M = ${sc.M}</div>
      <div class="row"><label for="im">IM (lux)</label><input class="inp" id="im" inputmode="decimal"><label for="im7">70 % da IM (lux)</label><input class="inp" id="im7" inputmode="decimal"><button class="btn" type="button" id="c">Conferir</button></div><div id="f" style="margin-top:.6rem"></div></div>`;
    $('#c',box).onclick=()=>{const a=pn($('#im',box).value),b=pn($('#im7',box).value);const okA=a!=null&&Math.abs(a-r.IM)<=Math.max(2,0.01*r.IM), okB=b!=null&&Math.abs(b-0.7*r.IM)<=Math.max(2,0.01*r.IM);
      if(!(okA&&okB))st.err[3]=1;
      $('#f',box).innerHTML=(okA?fb('ok',`IM = ${f(r.IM,1)} lux.`):fb('bad','IM não confere.',`Substitua: [${f(r.R,2)}·${sc.N-1}·${sc.M-1} + ${f(r.Q,2)}·${sc.N-1} + ${f(r.T,2)}·${sc.M-1} + ${f(r.P,2)}] / ${sc.N*sc.M}.`))+(okB?fb('ok',`70 % da IM = ${f(0.7*r.IM,1)} lux.`,'Nenhum ponto de tarefa pode ficar abaixo desse valor.'):fb('bad','70 % da IM não confere.','Multiplique a IM por 0,7.'));
      if(okA&&okB){$('#f',box).insertAdjacentHTML('beforeend',caderno('Registre a conta completa da IM e o valor de 70 % da IM.','e3p4')+nextBtn('Medir as áreas de tarefa'));bindCaderno(box);bindNext(box,next)}};
  }},
  {t:'Medir as áreas de tarefa',render(box,st,next){
    const sc=E3SC[st.scId]; const model=e3Model(sc); const q=Q1[sc.row]; st.tv=st.tv||{}; st.tat=st.tat??0;
    const T=sc.tasks.map((t,i)=>({id:'T'+(i+1),x:t[0],y:t[1]}));
    const ldr=st.ldr; ldr.src=()=>st.tat==null?null:model(T[st.tat].x,T[st.tat].y,st.cond.cort==='abertas');

      const top=(X,Y)=>T.map((p,i)=>`<g class="mpt ${st.tv[p.id]!=null?'done':''}" data-i="${i}"><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${st.tat===i?16:12}" style="stroke:var(--ac);${st.tat===i?'stroke-width:5':''}"/><text x="${X(p.x)+15}" y="${Y(p.y)+20}">${p.id}</text></g>`).join('');

      st.crit={c1,c2,c3,c4,mn,mx,ok:c1&&c2&&c3&&c4};
      const qs=[
        {id:'#k1',q:`<b>Quadro 1 com tolerância:</b> todos os pontos ≥ ${Math.round(0.9*q[1])} lux (0,9 × ${q[1]})?`,v:c1,exp:`Menor valor medido: ${mn} lux.`},
        {id:'#k2',q:`<b>Uniformidade:</b> todos os pontos ≥ 70 % da IM (${f(0.7*IM,0)} lux)?`,v:c2,exp:`Menor valor: ${mn} lux.`},
        {id:'#k3',q:`<b>Contraste:</b> maior valor / IM ≤ 5?`,v:c4,exp:`${mx} / ${f(IM,1)} = ${f(mx/IM,2)}.`}];
      $('#crit',box).innerHTML=`<h3>Aplique os critérios do item 5</h3><div id="k1"></div><div id="k2" hidden></div><div id="k3" hidden></div>`;
      qs.forEach((k,j)=>inlineMC(box,k.id,{q:k.q,opts:[k.v?'Sim, atende.':'Não atende.',k.v?'Não atende.':'Sim, atende.'],ok:0,exp:k.exp},(ok,first)=>{if(first&&!ok)st.err[4]=1;
        if(j<2)$(qs[j+1].id,box).hidden=false; else {$('#crit',box).insertAdjacentHTML('beforeend',caderno(`Monte no caderno a tabela de verificação: ponto, E medido, ≥ ${Math.round(0.9*q[1])}?, ≥ 70 % IM?, ≥ 200?`,'e3p5')+nextBtn('Ir para a avaliação preliminar'));bindCaderno(box);bindNext(box,next)}}));
    };

    box.innerHTML=`<div class="panel"><div class="eyebrow">Etapa 5</div><h2>Áreas de tarefa</h2><p class="sub">Agora a fotocélula vai no <b>plano da tarefa</b> (6.4): sobre cada ${sc.tn}. Clique no ponto azul e pressione <b>MEM</b>. Referências: E = ${q[1]} lux; IM = ${f(st.im.IM,1)} lux.</p></div>
      <div class="grid2" style="align-items:start"><div class="panel"><div class="plan-wrap" id="plan"></div></div><div style="display:grid;gap:.8rem"><div class="bench" id="bench">${ldr.html()}</div><div class="panel" id="tbl"></div></div></div>
      <div class="panel" id="crit"><p class="muted">Os critérios aparecem quando os seis pontos estiverem medidos.</p></div>`;
    ldr.mount($('#bench',box)); draw();
  }},
  {t:'Avaliação preliminar',render(box,st,next){
    const sc=E3SC[st.scId];
    const obs={reun:{o:'Durante a vistoria, os usuários relatam que, ao olhar para a tela do notebook, enxergam o reflexo das luminárias e precisam inclinar a tela.',q:'Segundo o Anexo 2 da NHO 11, que aspecto é esse e qual recomendação cabe?',opts:['Ofuscamento refletido (reflexão veladora): reposicionar a estação ou as luminárias, usar superfícies foscas, deslocar as fontes que geram o reflexo.','Iluminação insuficiente: aumentar o número de luminárias.','Efeito estroboscópico: usar reatores de alta frequência.','Aparência de cor: trocar por lâmpadas de 2 700 K.'],exp:'Quadro A2: contraste reduzido da tarefa devido a reflexões veladoras. A Nota 2 do Quadro 1 também alerta para ofuscamento em estações com monitores.'},

      ${fb(c.ok?'ok':'warn','Leitura do resultado',why)}

quiz(){
  const R=r1(rnd(560,700)),Q=r1(rnd(400,520)),T=r1(rnd(380,500)),P=r1(rnd(240,330)); const N=pick([3,4]),M=pick([2,3]);
  const IM=(R*(N-1)*(M-1)+Q*(N-1)+T*(M-1)+P)/(N*M);
  const E=pick([300,500,750]); const v=Math.round(E*rnd(0.88,0.95));
  const bank=[

function e4Calc(p,met,clo){
  const ta=mean(p.ta), va=mean(p.va), g=trGlobo(p.tg,p.ta[1],va), A=coefA(va), to=A*ta+(1-A)*g.tr, r=pmvCalc(ta,g.tr,va,p.ur,met,clo);

}

<h2>As seis variáveis do conforto (NBR 16401-2)</h2>

${concept('PMV e PPD',`<p>O <b>PMV</b> (voto médio predito) estima a sensação térmica média de um grupo numa escala de −3 (muito frio) a +3 (muito quente). O <b>PPD</b> é a porcentagem predita de insatisfeitos. A NBR 16401-2 (Tabela 4) considera o ambiente termicamente aceitável quando <b>−0,5 &lt; PMV &lt; +0,5</b>, o que corresponde a <b>PPD &lt; 10 %</b>. O cálculo usa o código do Anexo C da norma, que esta trilha reproduz.</p><p>O método do PMV vale para velocidade média do ar <b>abaixo de 0,20 m/s</b> (Tabela 2). Acima disso, aplica-se o método de 6.3.2 (efeito resfriativo).</p>`)}

<div class="tbl-wrap"><table class="t"><thead><tr><th>Código</th><th>Enquadramento</th></tr></thead><tbody>${CATS.map(c=>`<tr><td class="mono">${c[0]}</td><td>${c[1]}</td></tr>`).join('')}</tbody></table></div>
${caderno(`<ol><li>Faça um mapa mental com a NR-17 no centro e, saindo dela, as normas técnicas que ela aciona (NBR 10152, NHO 11, NBR 16401-2). Em outra cor, ligue as normas de exposição (NR-15, NHO 01, NHO 06) que <b>não</b> são de conforto.</li></ol>`,'e5a')}
<div class="guide"><button class="btn pri" type="button" data-tab="praticar">Ir para a classificação dos casos</button></div>`},
side(){return `<div class="box"><h4>Nesta estação</h4><ul><li>classificar 8 casos;</li><li>gerar o relatório da trilha para entregar.</li></ul></div>`},
praticar(el){
  const st=E5.st=E5.st||{ans:{}};
  el.innerHTML=`<div class="panel" style="margin-top:1.4rem"><div class="eyebrow">Classificação</div><h2>Qual norma se aplica?</h2><p class="sub">Para cada caso, escolha o enquadramento. Depois clique em "Corrigir".</p></div>
    <div class="cases" style="margin-top:1rem">${CASES.map((c,i)=>`<div class="case"><b>Caso ${i+1}</b><p>${c[0]}</p><select id="cs${i}" aria-label="Enquadramento do caso ${i+1}"><option value="">Escolha…</option>${CATS.map(k=>`<option value="${k[0]}" ${st.ans[i]===k[0]?'selected':''}>${k[0]} · ${k[1]}</option>`).join('')}</select><div id="cf${i}"></div></div>`).join('')}</div>
    <div class="row" style="margin-top:1rem"><button class="btn pri" type="button" id="corr">Corrigir</button></div><div id="cres" style="margin-top:1rem"></div>`;
  CASES.forEach((c,i)=>$('#cs'+i,el).onchange=e=>{st.ans[i]=e.target.value});
  $('#corr',el).onclick=()=>{let ok=0;CASES.forEach((c,i)=>{const a=st.ans[i];const r=a===c[1];if(r)ok++;$('#cf'+i,el).innerHTML=a?fb(r?'ok':'bad',r?'Correto.':`Resposta: ${c[1]}.`,c[2]):fb('warn','Sem resposta.')});
    setRes('e5','pratica',{feito:true,acertos:ok,total:CASES.length});
    $('#cres',el).innerHTML=fb(ok===CASES.length?'ok':'info',`${ok} de ${CASES.length} casos corretos.`,'Agora gere o relatório da trilha na aba "Relatório".')+caderno('Anote os casos em que você errou e a justificativa correta.','e5p');bindCaderno(el)};
},
relatorio(el){
  const R=k=>S.res[k]||{};
  const av=k=>{const a=R(k).aval;return a?`${a.nota}/${a.total} (${a.pct}%)`:'não realizada'};
  const p1=R('e1').pratica, p2=R('e2').pratica, p3=R('e3').pratica, p4=R('e4').pratica, p5=R('e5').pratica;
  const cads=Object.values(S.res._cad||{}).filter(Boolean).length;
  const txt=[
`RELATÓRIO DA TRILHA — LABORATÓRIO NR-17 (condições ambientais de trabalho)`,
`Aluno(a): ${S.aluno||'(não informado)'} · Turma: ${S.turma||'(não informada)'} · Data: ${new Date().toLocaleDateString('pt-BR')}`,
``,
`Ensaio 1 — Ajuste e verificação do sonômetro (NBR 10152, 7.1)`,
p1?`  Cal.Level: ${f(p1.cal,1)} dB · verificação final: ${f(p1.ver,1)} dB · série ${p1.valida?'válida':'descartada'} · etapas com erro: ${p1.erros}`:'  Prática não concluída',
`  Avaliação: ${av('e1')}`,
`Ensaio 2 — Ruído em ambiente interno (NR-17 17.8.4.1 + NBR 10152)`,
p2?`  ${p2.amb}: LAeq ${f(p2.laeq,1)} ± ${f(p2.U,1)} dB · LASmax ${f(p2.max,1)} dB · LNC ${p2.nc} · som tonal: ${p2.tonal} · simplificado: ${p2.simp?'adequado':'inadequado'} · detalhado: ${p2.det?'adequado':'inadequado'} · etapas com erro: ${p2.erros}`:'  Prática não concluída',
`  Avaliação: ${av('e2')}`,
`Ensaio 3 — Iluminamento (NR-17 17.8.3 + NHO 11)`,
p3?`  ${p3.amb}: E = ${p3.E} lux · IM = ${f(p3.IM,1)} lux · tarefas ${p3.min}–${p3.max} lux · ${p3.ok?'atende':'não atende'} · etapas com erro: ${p3.erros}`:'  Prática não concluída',
`  Avaliação: ${av('e3')}`,
`Ensaio 4 — Conforto térmico (NR-17 17.8.4.2 + NBR 16401-2)`,
p4?`  PMV P1 ${f(p4.p1,2)} · P2 ${f(p4.p2,2)} · P3 ${f(p4.p3,2)} · etapas com erro: ${p4.erros}`:'  Prática não concluída',
`  Avaliação: ${av('e4')}`,
`Estação 5 — Qual norma se aplica?`,
p5?`  ${p5.acertos}/${p5.total} casos corretos`:'  Não realizada',
``,
`Anotações no caderno marcadas como feitas: ${cads}`].join('\n');
  el.innerHTML=`<div class="report" style="margin-top:1.4rem"><div class="eyebrow">Relatório da trilha</div><h2>Resumo para entregar ao professor</h2>
    <p class="sub">Confira seu nome na página inicial. Copie o texto abaixo e envie pelo canal indicado pelo professor, junto com a foto das anotações do caderno.</p>
    <pre class="formula" style="white-space:pre-wrap" id="rtxt">${esc(txt)}</pre>
    <div class="row"><button class="btn pri" type="button" id="cp">Copiar relatório</button><span id="cpm" class="small muted"></span></div></div>`;
  $('#cp',el).onclick=()=>{const t=txt;const done=()=>{$('#cpm',el).textContent='Copiado.'};
    try{navigator.clipboard.writeText(t).then(done,()=>{sel()})}catch(e){sel()}
    function sel(){const r=document.createRange();r.selectNodeContents($('#rtxt',el));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#cpm',el).textContent='Texto selecionado: use Ctrl+C (ou "Copiar" no celular).'}};
}};

/* =====================================================================
   APLICATIVO
   ===================================================================== */
const ENS=[
 {id:'e1',n:1,cat:'ac',catN:'Acústica',t:'Ajuste e verificação do sonômetro',r:'Antes de medir: certificados, calibrador acústico e o ajuste pelo menu do sonômetro.',refs:'NBR 10152 · 5, 6, 7.1 · CAL-5000 · DEC-7000',mod:E1},
 {id:'e2',n:2,cat:'ac',catN:'Acústica',t:'Ruído em ambiente interno',r:'Pontos na planta, 30 s por ponto, LAeq, LASmax, curva NC e som tonal.',refs:'NR-17 · 17.8.4.1 · NBR 10152',mod:E2},
 {id:'e3',n:3,cat:'lu',catN:'Iluminação',t:'Iluminamento',r:'Luxímetro, iluminância média do Anexo 1 e critérios ponto a ponto nas tarefas.',refs:'NR-17 · 17.8.1–17.8.3 · NHO 11 · LDR-225',mod:E3},
 {id:'e4',n:4,cat:'te',catN:'Térmico',t:'Conforto térmico',r:'Escolha do instrumento, ocupante representativo, PMV/PPD e correntes de ar.',refs:'NR-17 · 17.8.4.2 · NBR 16401-2:2024',mod:E4},
 {id:'e5',n:5,cat:'gr',catN:'Integração',t:'Qual norma se aplica?',r:'Classificar casos entre conforto, exposição e impacto ambiental. Gerar o relatório.',refs:'NR-17 · NR-15 · NHO 01 · NHO 06 · NBR 10151',mod:E5}];

const App={
  route:'inicio', tab:'aprender',
  render(){
    clearTimers();
    const h=(location.hash||'').replace('#','');
    const m=h.match(/^(e[1-5])(aprender|praticar|avaliacao|relatorio)?$/);
    if(m){this.route=m[1];this.tab=m[2]||this.tab||'aprender'} else this.route='inicio';
    const app=$('#app');
    if(this.route==='inicio'){this.home(app);$('#crumbs').textContent='';window.scrollTo(0,0);return}
    const E=ENS.find(e=>e.id===this.route);
    $('#crumbs').textContent=`Estação ${E.n} · ${E.t}`;
    const tabs=E.id==='e5'?[['aprender','Ler'],['praticar','Classificar'],['relatorio','Relatório']]:[['aprender','Aprender'],['praticar','Praticar'],['avaliacao','Avaliação']];
    if(!tabs.find(t=>t[0]===this.tab))this.tab='aprender';
    const pr=getRes(E.id,'pratica'), av=getRes(E.id,'aval');
    app.innerHTML=`<div class="ens-head"><div><span class="chip c-${E.cat}">${E.catN}</span> <span class="eyebrow">Estação ${E.n} de 5</span><h1>${E.t}</h1><div class="refs">${E.refs}</div></div>
      <div role="tablist" class="tabs">${tabs.map(t=>`<button class="tab" role="tab" type="button" aria-selected="${t[0]===this.tab}" data-go="${t[0]}">${t[1]}${t[0]==='praticar'&&pr?'<small>✓</small>':''}${t[0]==='avaliacao'&&av?`<small>${av.pct}%</small>`:''}</button>`).join('')}</div></div>
      <div id="tabbody"></div>
      <div class="guide">${E.n>1?`<a class="btn" href="#${ENS[E.n-2].id}">← Estação ${E.n-1}</a>`:''}<a class="btn ghost" href="#inicio">Voltar à trilha</a>${E.n<5?`<a class="btn" href="#${ENS[E.n].id}" style="margin-left:auto">Estação ${E.n+1} →</a>`:''}</div>`;
    $$('[data-go]',app).forEach(b=>b.onclick=()=>{this.tab=b.dataset.go;history.replaceState(null,'','#'+E.id+(this.tab==='aprender'?'':this.tab));this.render()});
    const body=$('#tabbody');
    if(this.tab==='aprender'){body.innerHTML=`<div class="learn"><div class="prose">${E.mod.aprender()}</div><aside class="side">${E.mod.side()}</aside></div>`}
    else if(this.tab==='praticar'){E.mod.praticar(body)}
    else if(this.tab==='avaliacao'){body.innerHTML='<div style="margin-top:1.4rem;max-width:860px" id="qz"></div>';runQuiz($('#qz'),E.id,()=>E.mod.quiz(),'Questões sorteadas, com números diferentes a cada tentativa. Use calculadora e suas anotações.')}
    else if(this.tab==='relatorio'){E5.relatorio(body)}
    bindCaderno(app);
    app.addEventListener('click',this._tabLink||(this._tabLink=e=>{const t=e.target.closest('[data-tab]');if(t){this.tab=t.dataset.tab;history.replaceState(null,'','#'+this.route+(this.tab==='aprender'?'':this.tab));this.render();window.scrollTo({top:0,behavior:'smooth'})}}));
  },
  home(app){
    const st=e=>{const p=getRes(e.id,'pratica'),a=getRes(e.id,'aval');
      return `${p?'<span class="pill ok">prática feita</span>':'<span class="pill">prática</span>'}${e.id!=='e5'?(a?`<span class="pill ${a.pct>=70?'ok':'warn'}">avaliação ${a.pct}%</span>`:'<span class="pill">avaliação</span>'):''}`};
    app.innerHTML=`<section class="hero"><div><div class="eyebrow">Especialização Técnica em Higiene Ocupacional · NR-17</div>
      <h1>Condições ambientais de trabalho: ruído, luz e calor</h1>
      <p class="lead">Um laboratório virtual com os instrumentos e as normas que o técnico usa para verificar se um ambiente atende à NR-17. Siga as cinco estações em ordem. Em cada uma: <b>leia</b> os conceitos e os trechos das normas, <b>pratique</b> com o instrumento virtual e <b>faça a avaliação</b>. Tenha o caderno ao lado: a trilha pede anotações em vários momentos.</p>
      <div class="idbox"><div class="field"><label for="nm">Seu nome</label><input id="nm" value="${esc(S.aluno)}" autocomplete="name"></div><div class="field"><label for="tm">Turma</label><input id="tm" value="${esc(S.turma)}" style="width:9rem"></div></div></div>
      <div class="map"><h2>Item 17.8 da NR-17 e as normas que ele aciona</h2><ol>
        <li><span class="it">17.8.1–17.8.3</span><span>Iluminação<span class="to">NHO 11 (Fundacentro, 2018)</span></span></li>
        <li><span class="it">17.8.4</span><span>Atividades de solicitação intelectual e atenção constantes<span class="to">exigem conforto acústico e térmico</span></span></li>
        <li><span class="it">17.8.4.1</span><span>Conforto acústico<span class="to">ABNT NBR 10152:2017 (Tabela 3) ou 65 dB(A)</span></span></li>
        <li><span class="it">17.8.4.2</span><span>Conforto térmico<span class="to">18–25 °C em ambiente climatizado · método: ABNT NBR 16401-2:2024</span></span></li>
        <li><span class="it">17.8.4.2.1</span><span>Correntes de ar sobre o trabalhador<span class="to">controle da ventilação</span></span></li></ol></div></section>
    <div class="trail-h"><h2>Trilha</h2><span class="muted small">Seu progresso fica salvo neste navegador.</span></div>
    <ol class="trail">${ENS.map(e=>`<li style="display:contents"><a class="station" href="#${e.id}" style="text-decoration:none;color:inherit"><span class="n">${e.n}</span><span class="chip c-${e.cat}" style="align-self:flex-start">${e.catN}</span><h3>${e.t}</h3><p>${e.r}</p><div class="st">${st(e)}</div><div class="refs">${e.refs}</div></a></li>`).join('')}</ol>
    <p class="note">Os instrumentos são versões virtuais do sonômetro Instrutherm DEC-7000, do calibrador CAL-5000 e do luxímetro LDR-225, com menus e passos tirados dos manuais. No ensaio térmico, o "kit de conforto" é um instrumento genérico. Os ambientes e os valores medidos são simulados para fins didáticos.</p>`;
    $('#nm').oninput=e=>{S.aluno=e.target.value;save()}; $('#tm').oninput=e=>{S.turma=e.target.value;save()};
  }
};

/* ---------- inicialização ---------- */
load();
(function(){let sc=1;try{sc=parseFloat(localStorage.getItem('labNR17.scale'))||1}catch(e){}
  const set=v=>{sc=Math.max(0.85,Math.min(1.5,v));document.documentElement.style.setProperty('--scale',sc);try{localStorage.setItem('labNR17.scale',sc)}catch(e){}};
  set(sc); $('#fPlus').onclick=()=>set(sc+0.1); $('#fMinus').onclick=()=>set(sc-0.1);})();
$('#goHome').onclick=()=>{location.hash='#inicio'};
window.addEventListener('hashchange',()=>{App.tab='aprender';const h=location.hash.replace('#','');const m=h.match(/^e[1-5](praticar|avaliacao|relatorio)$/);if(m)App.tab=m[1];App.render();window.scrollTo(0,0)});
App.render();
</script>
</body></html>
